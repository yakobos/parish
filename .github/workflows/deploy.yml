name: Live ParishOS GitOps Pipeline
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Access Remote Server and Deploy Latest Code
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ec2-user
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          cd /home/ec2-user/parishos
          git pull origin main
          docker-compose up --build -d
